<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes, maximum-scale=5" />
    <title>PDF Viewer – Swipe Left/Right (Clean)</title>

    <!-- Icons (optional) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
      :root {
        --bg: #0b0c0e;
        --panel: #111319;
        --panel-2: #1a1d26;
        --border: #2a2f3a;
        --fg: #e9eaee;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }
      /* iOS safe-area */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .page-header {
        padding: 0 12px;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 8px;
        background: var(--panel);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding-top: env(safe-area-inset-top);
      }
      .page-header .fileName {
        font-size: 15px;
        font-weight: bold;
      }

      /* Vùng cuộn ngang từng trang */
      #page-container {
        height: calc(100dvh - 50px - env(safe-area-inset-top));
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        align-items: center;
        margin-top: 50px;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      #page-container::-webkit-scrollbar {
        display: none;
      }

      .pageCanvas {
        flex: 0 0 100%;
        scroll-snap-align: center;
        display: block;
        margin: auto;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--border);
        width: calc(100dvw - env(safe-area-inset-left) - env(safe-area-inset-right));
        max-width: 100%;
        max-height: calc(100dvh - 70px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }

      #loader {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-2);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 8px;
        display: none;
        z-index: 20;
      }
      #page-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: var(--panel);
        color: var(--fg);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 15px;
        border-top: 1px solid var(--border);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div class="page-header"><span id="fileName" class="fileName">—</span></div>
    <div id="loader">Đang tải…</div>
    <div id="page-container"></div>
    <div id="page-footer">
      <span id="pageIndicator">Trang 0 / 0</span>
    </div>

    <script>
      (function () {
        // ====== File info ======
        var stored = localStorage.getItem("selectedFile");
        var data = stored ? JSON.parse(stored) : null;
        var BASE_URL = "https://cuongkk.github.io/Tai-lieu-/";
        var DEFAULT_FILE = data ? data.file + ".pdf" : "";
        if (data) {
          var nameEl = document.getElementById("fileName");
          nameEl.textContent = data.name || "—";
          document.title = data.name || document.title;
        }
        function getFileFromQuery() {
          try {
            var u = new URL(window.location.href);
            return u.searchParams.get("file");
          } catch (e) {
            return null;
          }
        }
        var FILE_NAME = getFileFromQuery() || DEFAULT_FILE;
        var PDF_URL = FILE_NAME ? new URL(FILE_NAME, BASE_URL).toString() : null;

        // ====== PDF.js worker ======
        if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }

        // ====== DOM ======
        var container = document.getElementById("page-container");
        var loader = document.getElementById("loader");

        // ====== State ======
        var pdfDoc = null;
        var totalPages = 0;
        var currentPage = 1;

        // ====== Helpers ======
        function showLoader(on) {
          loader.style.display = on ? "block" : "none";
        }
        function clamp(v, min, max) {
          return Math.min(Math.max(v, min), max);
        }
        function vw() {
          return Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
        }
        function vh() {
          return Math.max(document.documentElement.clientHeight, window.innerHeight || 0);
        }

        //Footer
        var pageIndicator = document.getElementById("pageIndicator");

        function updatePageIndicator() {
          if (!pageIndicator) return;
          pageIndicator.textContent = currentPage + " / " + totalPages;
        }

        // Fit trang vào cả chiều rộng & chiều cao hiện có
        function renderPage(num, canvas) {
          return pdfDoc.getPage(num).then(function (page) {
            var vp1 = page.getViewport({ scale: 1 });
            var dpr = Math.max(1, window.devicePixelRatio || 1);

            // khung hiển thị khả dụng (trừ header ~50px + margin)
            var cssW = vw();
            var cssH = vh() - 70; // 50 header + một ít đệm

            var scaleW = cssW / vp1.width;
            var scaleH = cssH / vp1.height;
            var cssScale = Math.min(scaleW, scaleH);
            var scale = cssScale * dpr;
            var viewport = page.getViewport({ scale: scale });

            // render pixels
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);

            // css hiển thị
            var finalCssW = Math.floor(vp1.width * cssScale);
            var finalCssH = Math.floor(vp1.height * cssScale);
            canvas.style.width = finalCssW + "px";
            canvas.style.height = finalCssH + "px";

            var ctx = canvas.getContext("2d", { alpha: false });
            return page.render({ canvasContext: ctx, viewport: viewport }).promise;
          });
        }

        function loadPdf(url) {
          if (!url) {
            alert('Không có URL PDF. Hãy set localStorage "selectedFile" hoặc thêm ?file=... vào URL.');
            return;
          }
          showLoader(true);
          var loading = window.pdfjsLib.getDocument({ url: url });
          loading.promise
            .then(function (doc) {
              pdfDoc = doc;
              totalPages = pdfDoc.numPages;
              container.innerHTML = "";
              updatePageIndicator();

              // Tạo canvas placeholder theo viewport để không giật
              var i,
                cssW = vw();
              var placeholderH = Math.floor((vh() - 70) * 0.98);
              for (i = 1; i <= totalPages; i++) {
                var c = document.createElement("canvas");
                c.className = "pageCanvas";
                c.style.width = cssW + "px";
                c.style.height = placeholderH + "px";
                container.appendChild(c);
              }

              // Render tuần tự
              var index = 0;
              function next() {
                if (index >= totalPages) {
                  showLoader(false);
                  if (container.children[0]) {
                    container.children[0].scrollIntoView({ behavior: "auto", inline: "center" });
                  }
                  return;
                }
                var canvas = container.children[index];
                renderPage(index + 1, canvas)
                  .then(function () {
                    index = index + 1;
                    next();
                  })
                  .catch(function (err) {
                    console.error("Render error at page", index + 1, err);
                    index = index + 1;
                    next();
                  });
              }
              next();
            })
            .catch(function (err) {
              console.error("Load PDF error:", err);
              alert("Không tải được PDF. Kiểm tra BASE_URL/FILE_NAME hoặc CORS.");
              showLoader(false);
            });
        }

        // Vuốt trái/phải để chuyển trang
        var startX = 0;
        var startTime = 0;
        var touchActive = false;
        var SWIPE_DIST = 60; // px
        var SWIPE_TIME = 600; // ms

        container.addEventListener(
          "touchstart",
          function (e) {
            if (e.touches.length !== 1) {
              return;
            }
            touchActive = true;
            startX = e.touches[0].clientX;
            startTime = Date.now();
          },
          { passive: true }
        );

        container.addEventListener(
          "touchend",
          function (e) {
            if (!touchActive) {
              return;
            }
            touchActive = false;
            var dx = e.changedTouches[0].clientX - startX;
            var dt = Date.now() - startTime;
            if (Math.abs(dx) > SWIPE_DIST && dt < SWIPE_TIME) {
              if (dx < 0 && currentPage < totalPages) {
                currentPage = currentPage + 1;
              } else if (dx > 0 && currentPage > 1) {
                currentPage = currentPage - 1;
              }
              var el = container.children[currentPage - 1];
              if (el) {
                el.scrollIntoView({ behavior: "smooth", inline: "center" });
                updatePageIndicator();
              }
            }
          },
          { passive: true }
        );

        // Re-render theo kích thước mới
        var resizeTimer = null;
        window.addEventListener("resize", function () {
          if (!pdfDoc) {
            return;
          }
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            showLoader(true);
            var canvases = Array.prototype.slice.call(container.children);
            (function rerenderAll(idx) {
              if (idx >= canvases.length) {
                var el = container.children[currentPage - 1];
                if (el) {
                  el.scrollIntoView({ behavior: "auto", inline: "center" });
                  updatePageIndicator();
                }
                showLoader(false);
                return;
              }
              renderPage(idx + 1, canvases[idx])
                .then(function () {
                  rerenderAll(idx + 1);
                })
                .catch(function () {
                  rerenderAll(idx + 1);
                });
            })(0);
          }, 120);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", function () {
            window.dispatchEvent(new Event("resize"));
          });
        }
        window.addEventListener("orientationchange", function () {
          setTimeout(function () {
            window.dispatchEvent(new Event("resize"));
          }, 200);
        });

        // Start
        if (PDF_URL) {
          loadPdf(PDF_URL);
        }
      })();
    </script>
  </body>
</html>
