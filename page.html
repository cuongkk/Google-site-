<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes, maximum-scale=5" />
    <title>PDF Viewer – Swipe Left/Right</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
      :root {
        --bg: #0b0c0e;
        --panel: #111319;
        --panel-2: #1a1d26;
        --border: #2a2f3a;
        --fg: #e9eaee;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
      }

      .page-header {
        height: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        position: fixed;
        top: 0;
        inset-inline: 0;
        z-index: 10;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .page-header .fileName {
        font-size: 15px;
        font-weight: bold;
      }

      #page-container {
        height: calc(100vh - 50px);
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        align-items: center;
        margin-top: 50px;
      }
      #page-container::-webkit-scrollbar {
        display: none;
      }

      .pageCanvas {
        flex: 0 0 100%;
        scroll-snap-align: center;
        display: block;
        margin: auto;
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 0 0 1px var(--border);
        max-width: 90vw;
        max-height: 90vh;
      }
      #loader {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-2);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 8px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="page-header"><span id="fileName" class="fileName">—</span></div>
    <div id="loader">Đang tải…</div>
    <div id="page-container"></div>

    <script>
      (async () => {
        const stored = localStorage.getItem("selectedFile");
        const data = stored ? JSON.parse(stored) : null;
        const BASE_URL = "https://cuongkk.github.io/Tai-lieu-/";
        const DEFAULT_FILE = data ? data.file + ".pdf" : "";
        if (data) document.getElementById("fileName").textContent = data.name || "—";

        const u = new URL(window.location.href);
        const FILE_NAME = u.searchParams.get("file") || DEFAULT_FILE;
        const PDF_URL = FILE_NAME ? new URL(FILE_NAME, BASE_URL).toString() : null;

        if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions) window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const container = document.getElementById("page-container");
        const loader = document.getElementById("loader");

        let pdfDoc = null;
        let totalPages = 0;
        let currentPage = 1;
        const bitmapCache = new Map();

        function showLoader(on) {
          loader.style.display = on ? "block" : "none";
        }

        function clamp(v, min, max) {
          return Math.min(Math.max(v, min), max);
        }

        async function renderPage(num, canvas) {
          const page = await pdfDoc.getPage(num);
          const vp1 = page.getViewport({ scale: 1 });
          const dpr = Math.max(1, window.devicePixelRatio || 1);
          const scale = (container.clientWidth / vp1.width) * dpr;
          const viewport = page.getViewport({ scale });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext("2d");
          await page.render({ canvasContext: ctx, viewport }).promise;
        }

        async function loadPdf(url) {
          showLoader(true);
          const loading = window.pdfjsLib.getDocument({ url });
          pdfDoc = await loading.promise;
          totalPages = pdfDoc.numPages;
          container.innerHTML = "";
          for (let i = 1; i <= totalPages; i++) {
            const c = document.createElement("canvas");
            c.className = "pageCanvas";
            container.appendChild(c);
            await renderPage(i, c);
          }
          showLoader(false);
        }

        // Vuốt trái/phải để chuyển trang
        let startX = 0,
          startTime = 0,
          touchActive = false;
        const SWIPE_DIST = 60;
        const SWIPE_TIME = 600;

        container.addEventListener(
          "touchstart",
          (e) => {
            if (e.touches.length !== 1) return;
            touchActive = true;
            startX = e.touches[0].clientX;
            startTime = Date.now();
          },
          { passive: true }
        );

        container.addEventListener(
          "touchend",
          (e) => {
            if (!touchActive) return;
            touchActive = false;
            const dx = e.changedTouches[0].clientX - startX;
            const dt = Date.now() - startTime;
            if (Math.abs(dx) > SWIPE_DIST && dt < SWIPE_TIME) {
              if (dx < 0 && currentPage < totalPages) currentPage++;
              else if (dx > 0 && currentPage > 1) currentPage--;
              const el = container.children[currentPage - 1];
              if (el) el.scrollIntoView({ behavior: "smooth", inline: "center" });
            }
          },
          { passive: true }
        );

        if (PDF_URL) await loadPdf(PDF_URL);
      })();
    </script>
  </body>
</html>
