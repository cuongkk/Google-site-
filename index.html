<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Trình đọc PDF động</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #f4f4f4;
      }
      #pdf-canvas {
        border: 1px solid #999;
        margin-top: 10px;
        background: white;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      }
      button {
        position: absolute;
        width: 40px;
        height: 40px;
        padding: 8px;
        border: none;
        border-radius: 50%;
        background: black;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        opacity: 0.4;
      }
      .inner-wrap {
        display: inline-block;
        position: relative;
      }
      .prev-button {
        left: 0;
        top: 50%;
        transform: translateY(-50%);
      }
      .next-button {
        right: 0;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <p id="file-name"></p>
    <div class="inner-wrap">
      <canvas id="pdf-canvas"></canvas>
      <button id="prev-page" class="prev-button">⬅</button>
      <button id="next-page" class="next-button">➡</button>
    </div>

    <script>
      // Lấy tên file từ URL
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("file") || "Bai tap tong hop.pdf"; // mặc định nếu không có

      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d");
      let pdfDoc = null,
        pageNum = 1;

      // Tải file PDF từ tên
      pdfjsLib
        .getDocument(fileName)
        .promise.then((pdf) => {
          pdfDoc = pdf;
          renderPage(pageNum);
        })
        .catch((err) => {
          document.getElementById("file-name").textContent = "❌ Không tìm thấy file: " + fileName;
        });

      function renderPage(num) {
        pdfDoc.getPage(num).then((page) => {
          const viewport = page.getViewport({ scale: 1.4 });
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          page.render({ canvasContext: ctx, viewport });
        });
      }

      document.getElementById("prev-page").addEventListener("click", () => {
        if (pageNum <= 1) return;
        pageNum--;
        renderPage(pageNum);
      });

      document.getElementById("next-page").addEventListener("click", () => {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        renderPage(pageNum);
      });
    </script>
  </body>
</html>
