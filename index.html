<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đọc PDF - Bài tập tổng hợp</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        background: #f2f2f2;
        text-align: center;
        padding: 20px;
      }
      canvas {
        border: 1px solid #999;
        box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        margin-top: 10px;
        background: white;
      }
      #controls {
        margin-top: 15px;
      }
      button {
        padding: 8px 16px;
        margin: 0 8px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        transition: background 0.3s;
      }
      button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <h2>📘 Bài tập tổng hợp - PDF Viewer</h2>
    <canvas id="pdf-canvas"></canvas>
    <div id="controls">
      <button id="prev-page">⬅ Trang trước</button>
      <span id="page-info"></span>
      <button id="next-page">Trang sau ➡</button>
    </div>

    <script>
      const url = "Bai tap tong hop.pdf"; // file PDF để đọc
      let pdfDoc = null;
      let pageNum = 1;
      const canvas = document.getElementById("pdf-canvas");
      const ctx = canvas.getContext("2d");

      // tải PDF
      pdfjsLib.getDocument(url).promise.then((pdf) => {
        pdfDoc = pdf;
        renderPage(pageNum);
      });

      function renderPage(num) {
        pdfDoc.getPage(num).then((page) => {
          const viewport = page.getViewport({ scale: 1.4 });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          const renderCtx = {
            canvasContext: ctx,
            viewport: viewport,
          };
          page.render(renderCtx);
          document.getElementById("page-info").textContent = `Trang ${num} / ${pdfDoc.numPages}`;
        });
      }

      document.getElementById("prev-page").addEventListener("click", () => {
        if (pageNum <= 1) return;
        pageNum--;
        renderPage(pageNum);
      });

      document.getElementById("next-page").addEventListener("click", () => {
        if (pageNum >= pdfDoc.numPages) return;
        pageNum++;
        renderPage(pageNum);
      });
    </script>
  </body>
</html>
