<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF Reader — Simple Pager</title>
    <style>
      :root {
        --gap: 10px;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0c0e;
        color: #e9eaee;
      }
      header {
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gap);
        background: #111319;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header .group {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      button,
      input[type="number"] {
        background: #1a1d26;
        color: #e9eaee;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #container {
        display: grid;
        place-items: center;
        padding: 16px;
      }
      canvas {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        max-width: 100%;
        height: auto;
        background: #fff;
      }
      #loader {
        display: none;
        padding: 8px 12px;
        background: #1a1d26;
        border: 1px solid #2a2f3a;
        border-radius: 8px;
        pointer-events: none;
      }
      .spacer {
        flex: 1;
      }
      .fileName {
        opacity: 0.8;
      }
      header {
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--gap);
        background: #111319;
        position: sticky;
        bottom: 0;
        z-index: 10;
      }
    </style>
    <!-- PDF.js (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <header>
      <div class="group">
        <button id="prevBtn" title="Trang trước (← / PageUp)">Prev</button>
        <div class="group">
          <input id="pageInput" type="number" min="1" value="1" style="width: 72px" />
          <span>/ <span id="pageCount">0</span></span>
        </div>
        <button id="nextBtn" title="Trang sau (→ / PageDown)">Next</button>
      </div>

      <div class="group">
        <button id="zoomOutBtn" title="Thu nhỏ (–)">−</button>
        <button id="zoomInBtn" title="Phóng to (+)">+</button>
        <button id="fitWidthBtn" title="Vừa chiều rộng">Fit Width</button>
        <button id="fitPageBtn" title="Vừa trang">Fit Page</button>
      </div>

      <div class="spacer"></div>

      <div class="group"><strong>File:</strong> <span id="fileName" class="fileName">—</span></div>
    </header>

    <div id="container">
      <div id="loader">Đang tải...</div>
      <canvas id="pdfCanvas" aria-label="PDF page"></canvas>
    </div>

    <footer></footer>
    <script src="page.js"></script>
  </body>
</html>
